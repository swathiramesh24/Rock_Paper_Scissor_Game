<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel ="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/Rock_Paper_Scissor_Game/logo.png">
  <title>Rock Paper Scissor</title>
</head>
<body>
  <div class="container">
    <h1>ROCK PAPER SCISSOR</h1>
    
    <div class="game-btn">
      <button class="play-btn" onclick="playMove('Rock');">✊</button>

      <button class="play-btn" onclick=" playMove('Paper');">✋</button>

      <button class="play-btn" onclick="playMove('Scissor');">✌</button>
    </div>

    <div class="results">
      <p class="js-result"></p>

      <p class="js-move"></p>
      <hr>
    </div>

    <div class="score-section">
      <div class="js-score"></div>
      <button class="reset-btn" onclick="
      score.Wins=0;
      score.Losses=0;
      score.Ties=0;
      localStorage.removeItem('score');
      updateScoreElement();
      resetScore();
    ">Reset Score</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
